<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: Молекулярные болезни</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 980px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #0f7b6c 0%, #1fa84f 100%);
    color: #fff;
    padding: 28px 40px;
    text-align: center;
  }
  .header h1 { font-size: 28px; margin-bottom: 8px; }
  .header p { font-size: 15px; opacity: .9; }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #f0f5f3;
    padding: 12px 40px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 15px;
  }
  .progress-bar {
    flex: 1 1 200px;
    height: 10px;
    background: #dde7e3;
    border-radius: 10px;
    overflow: hidden;
    min-width: 120px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #11998e, #38ef7d);
    width: 0%;
    transition: width .3s ease;
  }
  .progress-text {
    font-size: 14px; font-weight: 600; color: #555; white-space: nowrap;
  }
  .score-badge {
    font-size: 14px; font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    background: #e3f5ec;
    color: #0f7b6c;
    white-space: nowrap;
  }

  .quiz-body { padding: 25px 40px 40px; }

  .question-card {
    margin-bottom: 22px;
    padding: 18px 20px;
    border: 2px solid #e8e8e8;
    border-radius: 12px;
    background: #fafafa;
    transition: border-color .3s, background .3s;
  }
  .question-card.answered { border-color: #c5e1d6; }
  .question-card.correct   { border-color: #4caf50; background: #f1f8e9; }
  .question-card.incorrect { border-color: #f44336; background: #fff3f3; }

  .question-text {
    font-size: 16px; font-weight: 600; margin-bottom: 14px;
    line-height: 1.5; color: #2c3e50;
  }
  .question-number {
    display: inline-block;
    background: #0f7b6c; color: #fff;
    min-width: 30px; height: 30px; line-height: 30px;
    text-align: center; border-radius: 50%;
    font-size: 14px; margin-right: 8px; font-weight: 700;
    padding: 0 6px;
  }

  .options { display: flex; flex-direction: column; gap: 9px; }
  .option {
    display: flex; align-items: center;
    padding: 11px 15px;
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    cursor: pointer;
    transition: all .2s;
    font-size: 15px; line-height: 1.4;
    user-select: none;
  }
  .option:hover:not(.disabled) { border-color: #38ef7d; background: #eefaf3; }
  .option.selected:not(.disabled) { border-color: #11998e; background: #e3f5ec; }
  .option.correct-answer { border-color: #4caf50 !important; background: #e8f5e9 !important; }
  .option.wrong-answer  { border-color: #f44336 !important; background: #ffebee !important; }
  .option.disabled { cursor: default; }

  .option input[type="radio"] {
    appearance: none;
    width: 20px; height: 20px;
    border: 2px solid #9e9e9e;
    border-radius: 50%;
    margin-right: 12px;
    flex-shrink: 0;
    position: relative;
    transition: all .2s;
  }
  .option input[type="radio"]:checked { border-color: #11998e; background: #11998e; }
  .option input[type="radio"]:checked::after {
    content:''; position:absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    width:8px; height:8px; background:#fff; border-radius:50%;
  }
  .option.correct-answer input[type="radio"] { border-color:#4caf50; background:#4caf50; }
  .option.wrong-answer input[type="radio"]  { border-color:#f44336; background:#f44336; }

  .marker { margin-left: auto; font-size: 18px; padding-left: 8px; flex-shrink: 0; }

  .btn-container {
    text-align: center;
    padding: 10px 40px 40px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .btn {
    padding: 13px 32px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all .3s;
  }
  .btn-secondary { background: #e0e0e0; color: #333; }
  .btn-secondary:hover { background: #d0d0d0; }

  .hint {
    font-size: 13px; color: #888; text-align: center; margin: 10px 40px 30px;
    font-style: italic;
  }

  @media (max-width: 600px) {
    .quiz-body, .toolbar, .btn-container { padding-left: 16px; padding-right: 16px; }
    .header { padding: 22px 16px; }
    .header h1 { font-size: 22px; }
    .option { font-size: 14px; }
    .hint { margin-left: 16px; margin-right: 16px; }
  }
</style>
</head>

</div>

];

/* ===== Состояние ===== */
const answers = {};      // {qIndex: oIndex}
let correctCount = 0;
let wrongCount = 0;

const quizBody    = document.getElementById('quizBody');
const progressFill= document.getElementById('progressFill');
const progressText= document.getElementById('progressText');
const scoreBadge  = document.getElementById('scoreBadge');
const resetBtn    = document.getElementById('resetBtn');

/* ===== Рендер всех вопросов списком ===== */
function renderQuestions() {
  quizBody.innerHTML = '';
  questionsData.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'qcard-' + qi;

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.innerHTML = `<span class="question-number">${q.n}</span>${escapeHtml(q.text)}`;
    card.appendChild(qText);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'options';

    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      label.className = 'option';
      label.dataset.qindex = qi;
      label.dataset.oindex = oi;

      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'q_' + qi;
      radio.value = oi;
      radio.addEventListener('change', () => selectOption(qi, oi));

      const span = document.createElement('span');
      span.textContent = opt.t;

      const marker = document.createElement('span');
      marker.className = 'marker';

      label.appendChild(radio);
      label.appendChild(span);
      label.appendChild(marker);
      optsWrap.appendChild(label);
    });

    card.appendChild(optsWrap);
    quizBody.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== Мгновенная проверка при выборе ===== */
function selectOption(qi, oi) {
  if (answers[qi] !== undefined) return;

  answers[qi] = oi;
  const q = questionsData[qi];
  const correctIndex = q.options.findIndex(o => o.c);
  const card = document.getElementById('qcard-' + qi);

  card.querySelectorAll('.option').forEach(el => {
    const idx = Number(el.dataset.oindex);
    el.classList.add('disabled');
    el.querySelector('input').disabled = true;
    const marker = el.querySelector('.marker');

    if (idx === correctIndex) {
      el.classList.add('correct-answer');
      marker.textContent = '✓';
    }
    if (idx === oi && oi !== correctIndex) {
      el.classList.add('wrong-answer');
      marker.textContent = '✗';
    }
  });

  if (oi === correctIndex) {
    card.classList.add('correct');
    correctCount++;
  } else {
    card.classList.add('incorrect');
    wrongCount++;
  }

  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(answers).length;
  const total = questionsData.length;
  progressFill.style.width = (answered / total * 100) + '%';
  progressText.textContent = answered + ' / ' + total;
  scoreBadge.textContent = '✓ ' + correctCount + ' · ✗ ' + wrongCount;
}

/* ===== Сброс / начать заново ===== */
function resetQuiz() {
  Object.keys(answers).forEach(k => delete answers[k]);
  correctCount = 0;
  wrongCount = 0;
  renderQuestions();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

resetBtn.addEventListener('click', resetQuiz);

/* ===== Старт ===== */
renderQuestions();
updateProgress();
</script>
